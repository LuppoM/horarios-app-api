<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOTACIÓN PROGRAMADA</title>
    
    <!-- Ícono -->
    <link rel="icon" type="image/x-icon" href="/static/icono.ico">
    
    <!-- CSS Específico del Módulo -->
    <link rel="stylesheet" href="/archivos/dtprogramada.css">
</head>
<body>

    <!-- BARRA SUPERIOR DE CONTROL -->
    <div class="header-bar">
        <div class="header-title">
            <span>DOTACIÓN TEÓRICA - HORARIOS POR SECTOR</span>
            <span>Semana: 
                <input type="number" id="inputSemana" class="semana-input" onchange="cargarDatos()">
            </span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn-header" onclick="guardarCambios()">Guardar Cambios</button>
            <a href="/" class="btn-cerrar">Cerrar</a>
        </div>
    </div>

    <!-- PESTAÑAS DE PLANTAS -->
    <div class="tab-container">
        <button id="tabChoco" class="tab-btn active" onclick="cambiarPlanta('chocolate')">Chocolates</button>
        <button id="tabGolo" class="tab-btn" onclick="cambiarPlanta('golosinas')">Golosinas</button>
    </div>

    <!-- CONTENEDOR DE LA TABLA -->
    <div class="table-container">
        <table id="tablaDotacion">
            <thead>
                <tr>
                    <th rowspan="2" style="width: 30%;">LÍNEA / SECTOR</th>
                    <th colspan="3" class="th-turnos">DOTACIÓN POR TURNO</th>
                </tr>
                <tr>
                    <th class="th-turnos">06:00 a 14:00</th>
                    <th class="th-turnos">14:00 a 22:00</th>
                    <th class="th-turnos">22:00 a 06:00</th>
                </tr>
            </thead>
            <tbody id="tbodyDotacion">
                <!-- Generado dinámicamente -->
            </tbody>
        </table>
    </div>

    <!-- LÓGICA JS FUNCIONAL -->
    <script>
        let plantaActual = 'chocolate';
        let datosGlobales = null;

        document.addEventListener('DOMContentLoaded', () => {
            cargarDatos();
        });

        function cargarDatos() {
            const semanaInput = document.getElementById('inputSemana');
            let url = '/api/dtprogramada/datos';
            if (semanaInput.value) {
                url += `?semana=${semanaInput.value}`;
            }

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    datosGlobales = data;
                    document.getElementById('inputSemana').value = data.semana;
                    renderizarTabla();
                })
                .catch(err => console.error('Error al cargar datos:', err));
        }

        function cambiarPlanta(planta) {
            plantaActual = planta;
            document.getElementById('tabChoco').classList.toggle('active', planta === 'chocolate');
            document.getElementById('tabGolo').classList.toggle('active', planta === 'golosinas');
            renderizarTabla();
        }

        function renderizarTabla() {
            if (!datosGlobales) return;

            const turnos = ["06:00 a 14:00", "14:00 a 22:00", "22:00 a 06:00"];
            const sectores = (plantaActual === 'chocolate') 
                ? datosGlobales.sectores_chocolate 
                : datosGlobales.sectores_golosinas;

            // Mapeo rápido de dotaciones cargadas
            const mapDot = {};
            (datosGlobales.dotaciones || []).forEach(d => {
                let sec = d.sector || d[0];
                let tur = d.turno || d[1];
                let cant = d.cantidad !== undefined ? d.cantidad : d[2];
                mapDot[`${String(sec).trim().toUpperCase()}_${String(tur).trim()}`] = cant;
            });

            const tbody = document.getElementById('tbodyDotacion');
            tbody.innerHTML = '';

            sectores.forEach(s => {
                let nombreSec = typeof s === 'object' ? (s.nombre_sector || s.sector) : s;
                let nombreClean = String(nombreSec).trim();

                let tr = document.createElement('tr');
                let html = `<td class="sector-name">${nombreClean}</td>`;

                turnos.forEach(t => {
                    let key = `${nombreClean.toUpperCase()}_${String(t).trim()}`;
                    let val = mapDot[key] !== undefined ? mapDot[key] : 0;

                    html += `
                        <td>
                            <input type="number" 
                                   class="val-input" 
                                   data-sector="${nombreClean}" 
                                   data-turno="${t}" 
                                   value="${val}" 
                                   min="0">
                        </td>
                    `;
                });

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        function guardarCambios() {
            const semana = document.getElementById('inputSemana').value;
            const inputs = document.querySelectorAll('.val-input');
            const dotaciones = [];

            inputs.forEach(inp => {
                dotaciones.push({
                    sector: inp.dataset.sector,
                    turno: inp.dataset.turno,
                    cantidad: parseInt(inp.value) || 0
                });
            });

            const payload = {
                semana: semana,
                usuario: "Programacion",
                datos: dotaciones
            };

            fetch('/api/dtprogramada/guardar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'ok') {
                    alert('Dotación guardada correctamente.');
                    cargarDatos();
                } else {
                    alert('Error al guardar: ' + (data.message || 'Error desconocido'));
                }
            })
            .catch(err => {
                console.error('Error al guardar:', err);
                alert('Ocurrió un error al intentar guardar los cambios.');
            });
        }
    </script>
</body>
</html>
