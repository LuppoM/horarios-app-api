<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dotación Teórica por Horarios</title>
    <link rel="icon" type="image/x-icon" href="/static/icono.ico">
    <link rel="stylesheet" href="/archivos/dtprogramadavista.css">
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-left">
            <h2>DOTACIÓN TEÓRICA - HORARIOS POR SECTOR</h2>
            <label style="font-weight: bold;">Semana:</label>
            <input type="text" id="inputSemana" style="width: 50px; text-align: center; font-weight: bold; padding: 4px;" onchange="cargarDatos()">
            <button class="btn-accion" onclick="guardarDatos()">Guardar Cambios</button>
        </div>
        <div>
            <button class="btn-accion" style="background-color: #ffc7ce; color: #9c0006;" onclick="location.href='/'">Cerrar</button>
        </div>
    </div>

    <div class="tabs-container">
        <div class="tab-header">
            <button class="tab-btn active" onclick="cambiarTab('choco', event)">Chocolates</button>
            <button class="tab-btn" onclick="cambiarTab('golo', event)">Golosinas</button>
        </div>

        <!-- Pestaña Chocolates -->
        <div id="tabChoco" class="tab-content active">
            <table class="tabla-matriz" id="tablaChoco">
                <thead id="headChoco"></thead>
                <tbody id="bodyChoco"></tbody>
            </table>
        </div>

        <!-- Pestaña Golosinas -->
        <div id="tabGolo" class="tab-content">
            <table class="tabla-matriz" id="tablaGolo">
                <thead id="headGolo"></thead>
                <tbody id="bodyGolo"></tbody>
            </table>
        </div>
    </div>

    <script>
let datosGlobales = {};
const diasKeys = ["LUNES", "MARTES", "MIERCOLES", "JUEVES", "VIERNES"];

async function init() {
    const urlParams = new URLSearchParams(window.location.search);
    let semanaUrl = urlParams.get('semana');

    const inputSemana = document.getElementById('inputSemana');
    if (semanaUrl) {
        inputSemana.value = semanaUrl;
    }

    await cargarDatos();
}

async function cargarDatos() {
    const semana = document.getElementById('inputSemana').value || "";
    const url = `/api/dtprogramada/datos?semana=${semana}`;
    
    try {
        const res = await fetch(url);
        datosGlobales = await res.json();

        if (datosGlobales && datosGlobales.semana) {
            document.getElementById('inputSemana').value = datosGlobales.semana;
        }
        renderizarTablas();
    } catch (error) {
        console.error("Error al cargar los datos:", error);
    }
}

function renderizarTablas() {
    const turnos = datosGlobales.turnos || ["06:00 a 14:00", "14:00 a 22:00", "22:00 a 06:00"];
    const cantTurnos = turnos.length;

    let encabezadoHTML = `
        <tr>
            <th rowspan="2" class="th-sector-vacio">LÍNEA / SECTOR</th>
            <th colspan="${cantTurnos}" class="th-turno-grupo">DOTACIÓN POR TURNO</th>
            <th colspan="5" class="th-dias-grupo">DOTACIÓN POR DÍAS (LUNES A VIERNES)</th>
        </tr>
        <tr>
            ${turnos.map(t => `<th class="th-turno-grupo">${t}</th>`).join('')}
            ${diasKeys.map(d => `<th class="th-dias-grupo">${d}</th>`).join('')}
        </tr>
    `;

    const headChoco = document.getElementById('headChoco');
    const headGolo = document.getElementById('headGolo');
    if (headChoco) headChoco.innerHTML = encabezadoHTML;
    if (headGolo) headGolo.innerHTML = encabezadoHTML;

    const dotaciones = datosGlobales.dotaciones || {};
    renderizarCuerpo('bodyChoco', datosGlobales.sectores_chocolate || [], dotaciones.Chocolate || {}, turnos);
    renderizarCuerpo('bodyGolo', datosGlobales.sectores_golosinas || [], dotaciones.Golosinas || {}, turnos);
}

function renderizarCuerpo(tbodyId, sectores, dotacionPlanta, turnos) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    tbody.innerHTML = '';

    if (!sectores || sectores.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="${1 + turnos.length + diasKeys.length}" style="text-align: center; padding: 10px; color: #666;">No hay sectores registrados para esta planta.</td>`;
        tbody.appendChild(tr);
        return;
    }

    sectores.forEach((sector, filaIdx) => {
        const tr = document.createElement('tr');
        
        let html = `<td class="sector-nombre">${sector}</td>`;

        // Inputs habilitados para Turnos (SE AGREGÓ data-turno="${turno}")
        turnos.forEach((turno, tIdx) => {
            const val = (dotacionPlanta[sector] && dotacionPlanta[sector][turno] !== undefined) ? dotacionPlanta[sector][turno] : 0;
            html += `<td><input type="text" class="turno-input" data-sector="${sector}" data-turno="${turno}" data-fila="${filaIdx}" data-turno-idx="${tIdx}" value="${val}"></td>`;
        });

        // Inputs deshabilitados para Días (Lunes a Viernes)
        diasKeys.forEach(dia => {
            const valDia = (dotacionPlanta[sector] && dotacionPlanta[sector][dia] !== undefined) ? dotacionPlanta[sector][dia] : 0;
            html += `<td><input type="text" class="input-total dia-input" data-dia="${dia}" value="${valDia}" tabindex="-1" readonly></td>`;
        });

        tr.innerHTML = html;
        tbody.appendChild(tr);
    });

    configurarNavegacionTablas(tbodyId, turnos.length);
}

function configurarNavegacionTablas(tbodyId, cantTurnos) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;

    tbody.querySelectorAll('.turno-input').forEach(input => {
        input.addEventListener('keydown', function(e) {
            const tIdx = parseInt(this.dataset.turnoIdx);
            const trActual = this.closest('tr');

            if (e.key === 'Enter' || (e.key === 'Tab' && !e.shiftKey && tIdx === cantTurnos - 1)) {
                e.preventDefault();
                const siguienteTr = trActual.nextElementSibling;
                if (siguienteTr) {
                    const primerInputSig = siguienteTr.querySelector('.turno-input[data-turno-idx="0"]');
                    if (primerInputSig) primerInputSig.focus();
                }
            } 
            else if (e.key === 'Tab' && e.shiftKey && tIdx === 0) {
                const anteriorTr = trActual.previousElementSibling;
                if (anteriorTr) {
                    e.preventDefault();
                    const ultimoInputAnt = anteriorTr.querySelector(`.turno-input[data-turno-idx="${cantTurnos - 1}"]`);
                    if (ultimoInputAnt) ultimoInputAnt.focus();
                }
            }
        });
    });
}

function cambiarTab(tab, evt) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

    if (tab === 'choco') {
        document.getElementById('tabChoco').classList.add('active');
    } else {
        document.getElementById('tabGolo').classList.add('active');
    }
    if (evt && evt.currentTarget) {
        evt.currentTarget.classList.add('active');
    }
}

async function guardarDatos() {
    const semana = document.getElementById('inputSemana').value;
    
    if (!semana) {
        alert("Por favor, ingrese un número de semana.");
        return;
    }

    const estructura = { "Chocolate": {}, "Golosinas": {} };

    // Recopilar Chocolates
    document.querySelectorAll('#bodyChoco tr').forEach(tr => {
        const sectorEl = tr.querySelector('.sector-nombre');
        if (!sectorEl) return;
        const sector = sectorEl.textContent.trim();
        estructura.Chocolate[sector] = {};
        
        tr.querySelectorAll('.turno-input').forEach(inp => {
            const turno = inp.dataset.turno;
            if (turno) {
                estructura.Chocolate[sector][turno] = parseInt(inp.value) || 0;
            }
        });
        
        tr.querySelectorAll('.dia-input').forEach(inp => {
            const dia = inp.dataset.dia;
            if (dia) {
                estructura.Chocolate[sector][dia] = parseInt(inp.value) || 0;
            }
        });
    });

    // Recopilar Golosinas
    document.querySelectorAll('#bodyGolo tr').forEach(tr => {
        const sectorEl = tr.querySelector('.sector-nombre');
        if (!sectorEl) return;
        const sector = sectorEl.textContent.trim();
        estructura.Golosinas[sector] = {};
        
        tr.querySelectorAll('.turno-input').forEach(inp => {
            const turno = inp.dataset.turno;
            if (turno) {
                estructura.Golosinas[sector][turno] = parseInt(inp.value) || 0;
            }
        });
        
        tr.querySelectorAll('.dia-input').forEach(inp => {
            const dia = inp.dataset.dia;
            if (dia) {
                estructura.Golosinas[sector][dia] = parseInt(inp.value) || 0;
            }
        });
    });

    try {
        const res = await fetch('/api/dtprogramada/guardar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                semana: semana, 
                usuario: "Programacion",
                datos: estructura 
            })
        });

        const r = await res.json();
        if (r.status === 'ok') {
            alert("✅ Dotación teórica guardada correctamente para la Semana " + semana + ".");
            cargarDatos();
        } else {
            alert("❌ Error al guardar: " + (r.message || "Error al procesar los datos"));
        }
    } catch (error) {
        console.error("Error al guardar:", error);
        alert("❌ Error de comunicación con el servidor.");
    }
}

window.onload = init;
</script>
</body>
</html>
