<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipos de Horario</title>
    <link rel="icon" type="image/x-icon" href="/static/icono.ico">
    <link rel="stylesheet" href="/archivos/modmoivista.css">
</head>
<body>

    <div class="titulo-pantalla">TIPOS DE HORARIO</div>

    <!-- TOOLSTRIP -->
    <div class="toolstrip">
        <button class="btn-toolstrip" onclick="solicitarAccion('agregar')">Agregar</button>
        <button class="btn-toolstrip" onclick="solicitarAccion('modificar')">Modificar</button>
        <button class="btn-toolstrip" onclick="solicitarAccion('eliminar')">Eliminar</button>
        <button class="btn-toolstrip" onclick="location.href='/'">Cerrar</button>
    </div>

    <!-- TABLA DE DATOS -->
    <div class="tabla-frame" style="margin-top: 20px;">
        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr id="tablaEncabezados"></tr>
                </thead>
                <tbody id="tablaCuerpo"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL ABM TIPOS DE HORARIO -->
    <div id="modalAbm" class="modal-overlay">
        <div class="modal-content" style="width: 520px;">
            <h3 id="abmTitulo">Agregar Tipo de Horario</h3>
            
            <div style="margin-bottom: 12px;">
                <label style="display:block; font-size: 10pt; font-weight:bold; margin-bottom: 4px;">Tipo:</label>
                <input type="text" id="abmTipo" style="width: 100%; box-sizing: border-box; padding: 6px; font-size: 10pt;">
            </div>

            <div style="margin-bottom: 12px;">
                <label style="display:block; font-size: 10pt; font-weight:bold; margin-bottom: 4px;">Horarios / Turnos:</label>
                <div id="contenedorTurnos" style="background: #f9fbfd; border: 1px solid #d0d7de; padding: 10px; border-radius: 4px; max-height: 180px; overflow-y: auto;">
                </div>
                <button type="button" onclick="agregarFilaHorario()" style="margin-top: 8px; background-color: #cfe2f3; border: none; padding: 5px 10px; font-weight: bold; color: #003366; border-radius: 3px; cursor: pointer;">+ Agregar turno</button>
            </div>

            <div class="modal-buttons" style="margin-top: 15px; display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn-confirm" onclick="guardarAbm()">Guardar</button>
                <button class="btn-cancel" onclick="document.getElementById('modalAbm').style.display='none'">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let filaSeleccionadaIdx = null;
        let datosOriginales = [];
        let columnasOriginales = [];
        let idRegistroActual = null;
        
        const horasDisponibles = Array.from({length: 24}, (_, i) => String(i).padStart(2, '0') + ":00");

        async function cargarDatos() {
            try {
                const response = await fetch('/api/tipohorarios/datos');
                const data = await response.json();

                columnasOriginales = data.columnas || [];
                datosOriginales = data.datos || [];

                renderizarTabla(datosOriginales);
                filaSeleccionadaIdx = null;
            } catch (err) {
                console.error("Error cargando tipos de horario:", err);
            }
        }

        function renderizarTabla(datosAMostrar) {
            document.getElementById('tablaEncabezados').innerHTML = columnasOriginales.map((c, i) => `
                <th>
                    <div style="display: flex; flex-direction: column; gap: 4px;">
                        <span>${c}</span>
                        <input type="text" placeholder="Filtrar..." 
                            onkeyup="filtrarTabla(${i}, this.value)" 
                            style="font-size: 8pt; padding: 2px; width: 90%; border: 1px solid #b0c4de; border-radius: 3px;">
                    </div>
                </th>
            `).join('');

            document.getElementById('tablaCuerpo').innerHTML = datosAMostrar.map((fila) => {
                let idxOriginal = datosOriginales.indexOf(fila);
                return `<tr onclick="seleccionarFila(${idxOriginal}, this)">
                    ${fila.map(val => `<td>${val !== null ? val : ''}</td>`).join('')}
                </tr>`;
            }).join('');
        }

        function filtrarTabla(colIdx, textoBusqueda) {
            const texto = textoBusqueda.toLowerCase();
            const filasFiltradas = datosOriginales.filter(fila => {
                const val = fila[colIdx];
                const textoCelda = val !== null ? String(val).toLowerCase() : '';
                return textoCelda.includes(texto);
            });
            renderizarTabla(filasFiltradas);
        }

        function seleccionarFila(idx, elem) {
            document.querySelectorAll('#tablaCuerpo tr').forEach(tr => tr.classList.remove('selected'));
            elem.classList.add('selected');
            filaSeleccionadaIdx = idx;
        }

        function agregarFilaHorario(valInicio = "08:00", valFin = "16:00") {
            const contenedor = document.getElementById('contenedorTurnos');
            const rowDiv = document.createElement('div');
            rowDiv.style.display = "flex";
            rowDiv.style.alignItems = "center";
            rowDiv.style.gap = "8px";
            rowDiv.style.marginBottom = "6px";

            const selInicio = document.createElement('select');
            selInicio.className = "turno-inicio";
            selInicio.style.padding = "4px";
            horasDisponibles.forEach(h => {
                const opt = document.createElement('option');
                opt.value = h;
                opt.textContent = h;
                if (h === valInicio) opt.selected = true;
                selInicio.appendChild(opt);
            });

            const lbl = document.createElement('span');
            lbl.textContent = "a";
            lbl.style.fontWeight = "bold";

            const selFin = document.createElement('select');
            selFin.className = "turno-fin";
            selFin.style.padding = "4px";
            horasDisponibles.forEach(h => {
                const opt = document.createElement('option');
                opt.value = h;
                opt.textContent = h;
                if (h === valFin) opt.selected = true;
                selFin.appendChild(opt);
            });

            const btnEliminar = document.createElement('button');
            btnEliminar.type = "button";
            btnEliminar.textContent = "✕";
            btnEliminar.style.background = "#ffcccc";
            btnEliminar.style.color = "#990000";
            btnEliminar.style.border = "none";
            btnEliminar.style.padding = "3px 8px";
            btnEliminar.style.cursor = "pointer";
            btnEliminar.style.fontWeight = "bold";
            btnEliminar.style.borderRadius = "3px";
            btnEliminar.onclick = () => rowDiv.remove();

            rowDiv.appendChild(selInicio);
            rowDiv.appendChild(lbl);
            rowDiv.appendChild(selFin);
            rowDiv.appendChild(btnEliminar);

            contenedor.appendChild(rowDiv);
        }

        async function solicitarAccion(accion) {
            if (accion !== 'agregar' && filaSeleccionadaIdx === null) {
                alert("Por favor selecciona un registro de la tabla.");
                return;
            }

            const contenedor = document.getElementById('contenedorTurnos');
            contenedor.innerHTML = "";

            if (accion === 'agregar') {
                idRegistroActual = null;
                document.getElementById('abmTitulo').innerText = "Agregar Tipo de Horario";
                document.getElementById('abmTipo').value = "";
                agregarFilaHorario("08:00", "16:00");
                document.getElementById('modalAbm').style.display = 'flex';

            } else if (accion === 'modificar') {
                const fila = datosOriginales[filaSeleccionadaIdx];
                idRegistroActual = fila[0];

                const res = await fetch(`/api/tipohorarios/obtener/${idRegistroActual}`);
                const data = await res.json();

                if (data.error) {
                    alert(data.error);
                    return;
                }

                document.getElementById('abmTitulo').innerText = "Modificar Tipo de Horario";
                document.getElementById('abmTipo').value = data.tipo || "";
                
                const turnosStr = data.horarios_definidos || "";
                const turnos = turnosStr.split(",");
                if (turnos.length > 0 && turnos[0].trim() !== "") {
                    turnos.forEach(t => {
                        const partes = t.trim().split(" a ");
                        if (partes.length === 2) {
                            agregarFilaHorario(partes[0].trim(), partes[1].trim());
                        }
                    });
                } else {
                    agregarFilaHorario();
                }

                document.getElementById('modalAbm').style.display = 'flex';

            } else if (accion === 'eliminar') {
                const fila = datosOriginales[filaSeleccionadaIdx];
                idRegistroActual = fila[0];
                if (confirm(`¿Desea eliminar el tipo de horario seleccionado?`)) {
                    const res = await fetch(`/api/tipohorarios/eliminar/${idRegistroActual}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.status === 'ok') {
                        cargarDatos();
                    } else {
                        alert("Error al eliminar: " + data.message);
                    }
                }
            }
        }

        async function guardarAbm() {
            const tipo = document.getElementById('abmTipo').value.trim().toUpperCase();
            const filasTurnos = document.querySelectorAll('#contenedorTurnos > div');
            
            let listaTurnos = [];
            filasTurnos.forEach(row => {
                const ini = row.querySelector('.turno-inicio').value;
                const fin = row.querySelector('.turno-fin').value;
                listaTurnos.push(`${ini} a ${fin}`);
            });

            if (!tipo || listaTurnos.length === 0) {
                alert("Ingrese el tipo de horario y al menos un turno.");
                return;
            }

            const horariosDefinidos = listaTurnos.join(", ");

            const payload = {
                modo: idRegistroActual ? "modificar" : "insertar",
                id: idRegistroActual,
                datos: {
                    tipo: tipo,
                    horarios_definidos: horariosDefinidos
                }
            };

            const res = await fetch('/api/tipohorarios/guardar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (data.status === 'ok') {
                document.getElementById('modalAbm').style.display = 'none';
                cargarDatos();
            } else {
                alert(data.message || "Error al guardar.");
            }
        }

        window.onload = cargarDatos;
    </script>
</body>
</html>
