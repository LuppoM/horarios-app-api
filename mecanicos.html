<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios de Mecánicos</title>
    <link rel="icon" type="image/x-icon" href="/static/icono.ico">
    <link rel="stylesheet" href="/archivos/mecanicosvista.css?v=3">
    <script src="/archivos/relojespera.js" defer></script>
</head>
<body>

    <!-- Top bar -->
    <div class="top-bar">
        <button class="btn-accion btn-guardar" onclick="guardarMecanicos()">Guardar</button>
        <button class="btn-accion btn-cerrar" onclick="location.href='/'">Cerrar</button>
        
        <span class="semana-label">Semana actual:</span>
        <input type="text" id="inputSemana" class="semana-input" readonly>
    </div>

    <!-- Contenedor General con las tarjetas de planta y vacaciones -->
    <div class="plantas-container">
        
        <!-- CARGA DATOS - GOLOSINAS -->
        <div class="card-carga">
            <h3 class="card-titulo">GOLOSINAS</h3>
            <div id="bloquesGolosinas"></div>
        </div>

        <!-- CARGA DATOS - CHOCOLATES -->
        <div class="card-carga">
            <h3 class="card-titulo">CHOCOLATES</h3>
            <div id="bloquesChocolates"></div>
        </div>

        <!-- CARGA DATOS - VACACIONES -->
        <div class="card-carga">
            <h3 class="card-titulo">PERSONAL DE VACACIONES</h3>
            <div id="bloquesVacaciones"></div>
        </div>

    </div>

    <script>
        let mecanicosDisponibles = [];
        let semanaActualGlobal = "";

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            semanaActualGlobal = urlParams.get('semana') || "";
            await cargarDatos();
        }

        async function cargarDatos() {
            try {
                const res = await fetch(`/api/mecanicos/datos?semana=${semanaActualGlobal}`);
                const data = await res.json();

                semanaActualGlobal = data.semana || semanaActualGlobal;
                document.getElementById('inputSemana').value = semanaActualGlobal;
                mecanicosDisponibles = data.disponibles || [];

                const sectores = data.sectores || [];
                const asignados = data.asignados || [];

                const sectoresGolo = sectores.filter(s => (s.planta || '').toLowerCase().includes('golos'));
                const sectoresChoco = sectores.filter(s => (s.planta || '').toLowerCase().includes('choco'));
                const sectoresSinPlanta = sectores.filter(s => {
                    const p = (s.planta || '').toLowerCase();
                    return !p.includes('golos') && !p.includes('choco');
                });

                renderizarSectores('Golosinas', 'bloquesGolosinas', sectoresGolo, asignados);
                renderizarSectores('Chocolates', 'bloquesChocolates', sectoresChoco.concat(sectoresSinPlanta), asignados);
                renderizarVacaciones('Vacaciones', 'bloquesVacaciones', asignados);

            } catch (error) {
                console.error("Error al cargar mecánicos:", error);
                alert("Error al obtener los datos de mecánicos.");
            }
        }

        function renderizarSectores(nombrePlanta, idContenedor, listaSectores, asignados) {
            const contenedor = document.getElementById(idContenedor);
            contenedor.innerHTML = "";

            listaSectores.forEach(secObj => {
                const nombreSector = secObj.sector;
                const turnos = secObj.turnos || [];

                const secCard = document.createElement('div');
                secCard.className = "sector-bloque";
                secCard.innerHTML = `<h4 class="sector-subtitulo">${escaparHtml(nombreSector)}</h4>`;

                turnos.forEach(horario => {
                    const blockDiv = document.createElement('div');
                    blockDiv.className = "horario-block";
                    blockDiv.dataset.horario = horario;
                    blockDiv.dataset.planta = nombrePlanta;
                    blockDiv.dataset.sector = nombreSector;

                    const idContRows = `container_${limpiarId(nombrePlanta)}_${limpiarId(nombreSector)}_${limpiarId(horario)}`;

                    blockDiv.innerHTML = `
                        <div class="horario-header">
                            <strong>Horario: ${escaparHtml(horario)}</strong>
                            <button type="button" class="btn-agregar-op" onclick="agregarFilaOperario('${idContRows}')">+ Agregar operario</button>
                        </div>
                        <div class="rows-container" id="${idContRows}"></div>
                    `;

                    secCard.appendChild(blockDiv);

                    const asignadosEnBloque = asignados.filter(a =>
                        a[2] === horario &&
                        a[3] && a[3].toLowerCase() === nombrePlanta.toLowerCase()
                    );

                    asignadosEnBloque.forEach(a => {
                        agregarFilaOperario(idContRows, a[0], a[1]);
                    });
                });

                contenedor.appendChild(secCard);
            });
        }

        function renderizarVacaciones(nombrePlanta, idContenedor, asignados) {
            const contenedor = document.getElementById(idContenedor);
            contenedor.innerHTML = "";

            const horario = "VACACIONES";
            const idContRows = `container_${limpiarId(nombrePlanta)}_${limpiarId(horario)}`;

            const blockDiv = document.createElement('div');
            blockDiv.className = "horario-block";
            blockDiv.dataset.horario = horario;
            blockDiv.dataset.planta = nombrePlanta;

            blockDiv.innerHTML = `
                <div class="horario-header">
                    <strong>Mecánicos</strong>
                    <button type="button" class="btn-agregar-op" onclick="agregarFilaOperario('${idContRows}')">+ Agregar operario</button>
                </div>
                <div class="rows-container" id="${idContRows}"></div>
            `;

            contenedor.appendChild(blockDiv);

            const asignadosVac = asignados.filter(a =>
                a[2] === horario &&
                a[3] && a[3].toLowerCase() === nombrePlanta.toLowerCase()
            );

            asignadosVac.forEach(a => {
                agregarFilaOperario(idContRows, a[0], a[1]);
            });
        }

        function limpiarId(cadena) {
            return String(cadena || '').replace(/[^a-zA-Z0-9]/g, '_');
        }

        function escaparHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function agregarFilaOperario(idContRows, idVal = "", nombreVal = "") {
            const container = document.getElementById(idContRows);
            if (!container) return;

            const filaDiv = document.createElement('div');
            filaDiv.className = "fila-operario";

            const inputId = document.createElement('input');
            inputId.type = "text";
            inputId.className = "input-id-box";
            inputId.value = idVal;
            inputId.readOnly = true;

            const selectOp = document.createElement('select');
            selectOp.className = "select-operario-mecanico";
            selectOp.innerHTML = `<option value="">-- Seleccione Operario --</option>`;

            mecanicosDisponibles.forEach(([id, nombre]) => {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = nombre;
                if (parseInt(id) === parseInt(idVal) || nombre === nombreVal) {
                    opt.selected = true;
                    inputId.value = id;
                }
                selectOp.appendChild(opt);
            });

            selectOp.onchange = (e) => {
                inputId.value = e.target.value;
            };

            const btnEliminar = document.createElement('button');
            btnEliminar.type = "button";
            btnEliminar.className = "btn-eliminar-op";
            btnEliminar.textContent = "Eliminar";
            btnEliminar.onclick = () => filaDiv.remove();

            filaDiv.appendChild(inputId);
            filaDiv.appendChild(selectOp);
            filaDiv.appendChild(btnEliminar);

            container.appendChild(filaDiv);
        }

        async function guardarMecanicos() {
            let registros = [];

            document.querySelectorAll('.horario-block').forEach(bloque => {
                const horario = bloque.dataset.horario;
                const planta = bloque.dataset.planta;

                bloque.querySelectorAll('.fila-operario').forEach(fila => {
                    const idOp = fila.querySelector('.input-id-box').value;
                    if (idOp) {
                        registros.push([parseInt(idOp), horario, planta]);
                    }
                });
            });

            try {
                const res = await fetch('/api/mecanicos/guardar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ semana: semanaActualGlobal, registros: registros })
                });

                const r = await res.json();
                if (r.status === 'ok') {
                    alert("Horarios de mecánicos guardados correctamente.");
                    await cargarDatos();
                } else {
                    alert("Error al guardar: " + r.message);
                }
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Ocurrió un error al intentar guardar.");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
