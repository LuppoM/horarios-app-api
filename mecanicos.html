<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios de Mecánicos</title>
    <link rel="icon" type="image/x-icon" href="/static/icono.ico">
    <link rel="stylesheet" href="/archivos/mecanicosvista.css?v=1.0">
</head>
<body>

    <!-- Barra Superior estilizada exactamente igual a HGolo -->
    <div class="top-bar">
        <button class="btn-accion btn-guardar" onclick="guardarMecanicos()">Guardar</button>
        <button class="btn-accion btn-cerrar" onclick="location.href='/'">Cerrar</button>
        
        <span class="semana-label">Semana actual:</span>
        <input type="text" id="inputSemana" class="semana-input" readonly>
    </div>

    <!-- Lista limpia agrupada por planta/sector -->
    <div class="contenedor-mecanicos">

        <!-- Golosinas -->
        <div class="grupo-card">
            <h3 class="grupo-titulo">Golosinas</h3>
            <div id="listaGolosinas" class="lista-mecanicos"></div>
        </div>

        <!-- Pasivo Golosinas -->
        <div class="grupo-card">
            <h3 class="grupo-titulo">Pasivo Golosinas</h3>
            <div id="listaPasivo" class="lista-mecanicos"></div>
        </div>

        <!-- Chocolate -->
        <div class="grupo-card">
            <h3 class="grupo-titulo">Chocolate</h3>
            <div id="listaChocolate" class="lista-mecanicos"></div>
        </div>

    </div>

    <script>
        const TURNOS_MECANICOS = [
            "06:00 a 14:00",
            "07:00 a 15:00",
            "08:30 a 16:30",
            "14:00 a 22:00",
            "22:00 a 06:00"
        ];

        let datosGlobales = {};

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            let semanaUrl = urlParams.get('semana') || "";

            const inputSemana = document.getElementById('inputSemana');
            if (semanaUrl) inputSemana.value = semanaUrl;

            await cargarDatos();
        }

        async function cargarDatos() {
            const semana = document.getElementById('inputSemana').value || "";
            try {
                const res = await fetch(`/api/mecanicos/datos?semana=${semana}`);
                datosGlobales = await res.json();

                if (datosGlobales && datosGlobales.semana) {
                    document.getElementById('inputSemana').value = datosGlobales.semana;
                }
                renderizarMecanicos();
            } catch (error) {
                console.error("Error al cargar mecánicos:", error);
                alert("Error al conectar con el servidor.");
            }
        }

        function renderizarMecanicos() {
            const listaGolo = document.getElementById('listaGolosinas');
            const listaPasivo = document.getElementById('listaPasivo');
            const listaChoco = document.getElementById('listaChocolate');

            listaGolo.innerHTML = '';
            listaPasivo.innerHTML = '';
            listaChoco.innerHTML = '';

            const mecanicos = datosGlobales.mecanicos || [];

            if (mecanicos.length === 0) {
                listaGolo.innerHTML = '<p class="sin-datos">No hay mecánicos registrados.</p>';
                return;
            }

            mecanicos.forEach(mec => {
                // mec: [id, operario, horario, sector, planta]
                const [idOp, nombreOp, horVal, secVal, plaVal] = mec;

                const itemDiv = document.createElement('div');
                itemDiv.className = "mecanico-item";

                let optionsHor = `<option value="">-- Sin asignar --</option>`;
                TURNOS_MECANICOS.forEach(t => {
                    optionsHor += `<option value="${t}" ${t === horVal ? 'selected' : ''}>${t} hs</option>`;
                });

                itemDiv.innerHTML = `
                    <span class="mecanico-nombre">${nombreOp}</span>
                    <span class="mecanico-puntos">------------------------------------</span>
                    <select class="select-horario-simple" data-id="${idOp}" data-sector="${secVal || ''}" data-planta="${plaVal || ''}">
                        ${optionsHor}
                    </select>
                `;

                const plantaLower = (plaVal || "").toLowerCase();
                const sectorLower = (secVal || "").toLowerCase();

                if (sectorLower.includes("pasivo")) {
                    listaPasivo.appendChild(itemDiv);
                } else if (plantaLower.includes("chocolate")) {
                    listaChoco.appendChild(itemDiv);
                } else {
                    listaGolo.appendChild(itemDiv);
                }
            });
        }

        async function guardarMecanicos() {
            const semana = document.getElementById('inputSemana').value;
            let registros = [];

            document.querySelectorAll('.select-horario-simple').forEach(sel => {
                const idOp = parseInt(sel.dataset.id);
                const horario = sel.value;
                const sector = sel.dataset.sector || 'Mantenimiento';
                const planta = sel.dataset.planta || 'General';

                registros.push([idOp, horario, sector, planta]);
            });

            try {
                const res = await fetch('/api/mecanicos/guardar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ semana: semana, registros: registros })
                });

                const r = await res.json();
                if (r.status === 'ok') {
                    alert("Horarios de mecánicos guardados correctamente.");
                    await cargarDatos();
                } else {
                    alert("Error al guardar: " + r.message);
                }
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Ocurrió un error al guardar los datos.");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
