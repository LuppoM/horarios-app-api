<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios de Mecánicos</title>
    <link rel="icon" type="image/x-icon" href="/static/icono.ico">
    <link rel="stylesheet" href="/archivos/mecanicosvista.css?v=3">
</head>
<body>

    <!-- Top bar -->
    <div class="top-bar">
        <button class="btn-accion btn-guardar" onclick="guardarMecanicos()">Guardar</button>
        <button class="btn-accion btn-cerrar" onclick="location.href='/'">Cerrar</button>
        
        <span class="semana-label">Semana actual:</span>
        <input type="text" id="inputSemana" class="semana-input" readonly>
    </div>

    <!-- Contenedor General con dos tarjetas de planta -->
    <div class="plantas-container">
        
        <!-- CARGA DATOS - GOLOSINAS -->
        <div class="card-carga">
            <h3 class="card-titulo">GOLOSINAS</h3>
            <div id="bloquesGolosinas"></div>
        </div>

        <!-- CARGA DATOS - CHOCOLATES -->
        <div class="card-carga">
            <h3 class="card-titulo">CHOCOLATES</h3>
            <div id="bloquesChocolates"></div>
        </div>

    </div>

    <script>
        const HORARIOS_DEFINIDOS = [
            "06:00 a 14:00",
            "07:00 a 15:00",
            "08:30 a 16:30",
            "14:00 a 22:00",
            "22:00 a 06:00"
        ];

        let mecanicosDisponibles = [];
        let semanaActualGlobal = "";

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            semanaActualGlobal = urlParams.get('semana') || "";
            await cargarDatos();
        }

        async function cargarDatos() {
            try {
                const res = await fetch(`/api/mecanicos/datos?semana=${semanaActualGlobal}`);
                const data = await res.json();

                semanaActualGlobal = data.semana || semanaActualGlobal;
                document.getElementById('inputSemana').value = semanaActualGlobal;
                mecanicosDisponibles = data.disponibles || [];

                renderizarPlanta('Golosinas', 'bloquesGolosinas', data.asignados || []);
                renderizarPlanta('Chocolates', 'bloquesChocolates', data.asignados || []);

            } catch (error) {
                console.error("Error al cargar mecánicos:", error);
                alert("Error al obtener los datos de mecánicos.");
            }
        }

        function renderizarPlanta(nombrePlanta, idContenedor, asignados) {
            const contenedor = document.getElementById(idContenedor);
            contenedor.innerHTML = "";

            HORARIOS_DEFINIDOS.forEach(horario => {
                const blockDiv = document.createElement('div');
                blockDiv.className = "horario-block";
                blockDiv.dataset.horario = horario;
                blockDiv.dataset.planta = nombrePlanta;

                blockDiv.innerHTML = `
                    <div class="horario-header">
                        <strong>Horario: ${horario}</strong>
                        <button class="btn-agregar-op" onclick="agregarFilaOperario('${nombrePlanta}', '${horario}')">+ Agregar operario</button>
                    </div>
                    <div class="rows-container" id="container_${limpiarId(nombrePlanta)}_${limpiarId(horario)}"></div>
                `;

                contenedor.appendChild(blockDiv);

                // Filtrar mecánicos asignados a esta planta y a este horario
                const asignadosEnBloque = asignados.filter(a => 
                    (a[2] === horario) && (a[3] && a[3].toLowerCase() === nombrePlanta.toLowerCase())
                );

                asignadosEnBloque.forEach(a => {
                    agregarFilaOperario(nombrePlanta, horario, a[0], a[1]);
                });
            });
        }

        function limpiarId(cadena) {
            return cadena.replace(/[^a-zA-Z0-9]/g, '_');
        }

        function agregarFilaOperario(nombrePlanta, horario, idVal = "", nombreVal = "") {
            const container = document.getElementById(`container_${limpiarId(nombrePlanta)}_${limpiarId(horario)}`);
            if (!container) return;

            const filaDiv = document.createElement('div');
            filaDiv.className = "fila-operario";

            // Box ID
            const inputId = document.createElement('input');
            inputId.type = "text";
            inputId.className = "input-id-box";
            inputId.value = idVal;
            inputId.readOnly = true;

            // Combobox Operarios
            const selectOp = document.createElement('select');
            selectOp.className = "select-operario-mecanico";
            selectOp.innerHTML = `<option value="">-- Seleccione Operario --</option>`;

            mecanicosDisponibles.forEach(([id, nombre]) => {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = nombre;
                if (parseInt(id) === parseInt(idVal) || nombre === nombreVal) {
                    opt.selected = true;
                    inputId.value = id;
                }
                selectOp.appendChild(opt);
            });

            selectOp.onchange = (e) => {
                inputId.value = e.target.value;
            };

            // Botón eliminar
            const btnEliminar = document.createElement('button');
            btnEliminar.className = "btn-eliminar-op";
            btnEliminar.textContent = "Eliminar";
            btnEliminar.onclick = () => filaDiv.remove();

            filaDiv.appendChild(inputId);
            filaDiv.appendChild(selectOp);
            filaDiv.appendChild(btnEliminar);

            container.appendChild(filaDiv);
        }

        async function guardarMecanicos() {
            let registros = [];

            document.querySelectorAll('.horario-block').forEach(bloque => {
                const horario = bloque.dataset.horario;
                const planta = bloque.dataset.planta;

                bloque.querySelectorAll('.fila-operario').forEach(fila => {
                    const idOp = fila.querySelector('.input-id-box').value;
                    if (idOp) {
                        // [id_mecanico, horario, planta]
                        registros.push([parseInt(idOp), horario, planta]);
                    }
                });
            });

            try {
                const res = await fetch('/api/mecanicos/guardar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ semana: semanaActualGlobal, registros: registros })
                });

                const r = await res.json();
                if (r.status === 'ok') {
                    alert("Horarios de mecánicos guardados correctamente.");
                    await cargarDatos();
                } else {
                    alert("Error al guardar: " + r.message);
                }
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Ocurrió un error al intentar guardar.");
            }
        }

        window.onload = init;
    </script>
</body>
</html>
