<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios de Mecánicos</title>
    <link rel="icon" type="image/x-icon" href="/static/icono.ico">
    <link rel="stylesheet" href="/archivos/mecanicosvista.css?v=3">
    <script src="/archivos/relojespera.js" defer></script>
</head>
<body>

    <!-- Top bar -->
    <div class="top-bar">
        <button type="button" class="btn-accion btn-guardar" onclick="guardarMecanicos()">Guardar</button>
        <button type="button" class="btn-accion btn-cerrar" onclick="location.href='/'">Cerrar</button>

        <span class="semana-label">Semana actual:</span>
        <input type="text" id="inputSemana" class="semana-input" readonly>
    </div>

    <!-- Contenedor dinámico de sectores desde la BD -->
    <div id="gridContenedor" class="plantas-container grid-sectores"></div>

    <script>
        let datosGlobales = {};
        let mecanicosDisponibles = [];
        let semanaActualGlobal = "";

        function ocultarRelojEspera() {
            if (typeof ocultarCarga === "function") ocultarCarga();
            if (typeof cerrarCargando === "function") cerrarCargando();
            document.querySelectorAll(".reloj-espera, .cargando-overlay, #relojEspera, #overlayCarga").forEach(el => {
                el.style.display = "none";
            });
        }

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            semanaActualGlobal = urlParams.get('semana') || "";
            await cargarDatos();

            if (semanaActualGlobal && !urlParams.get('semana')) {
                const nuevaUrl = `${window.location.pathname}?semana=${encodeURIComponent(semanaActualGlobal)}`;
                window.history.replaceState({}, '', nuevaUrl);
            }
        }

        async function cargarDatos() {
            try {
                const querySemana = semanaActualGlobal ? `?semana=${encodeURIComponent(semanaActualGlobal)}` : "";
                const res = await fetch(`/api/mecanicos/datos${querySemana}`);
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }
                datosGlobales = await res.json();

                semanaActualGlobal = datosGlobales.semana || semanaActualGlobal;
                const inputSemana = document.getElementById('inputSemana');
                if (inputSemana) inputSemana.value = semanaActualGlobal;

                mecanicosDisponibles = datosGlobales.disponibles || datosGlobales.operarios_disponibles || [];
                renderizarUI();
            } catch (error) {
                console.error("Error al cargar mecánicos:", error);
                alert("Error al obtener los datos de mecánicos.");
            } finally {
                ocultarRelojEspera();
            }
        }

        function normalizarTexto(val) {
            return String(val ?? "")
                .trim()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/\s+/g, " ");
        }

        function normalizarHorario(val) {
            return normalizarTexto(val)
                .replace(/\s*-\s*/g, " a ")
                .replace(/\s+a\s+/g, " a ");
        }

        function limpiarId(cadena) {
            return String(cadena || "").replace(/[^a-zA-Z0-9]/g, "_");
        }

        function escaparHtml(str) {
            return String(str ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function clavePlantaOSector(plantaVal, sectorVal) {
            const texto = `${normalizarTexto(sectorVal)} ${normalizarTexto(plantaVal)}`.trim();
            if (texto.includes("vacac")) return "vacaciones";
            if (texto.includes("golosin")) return "golosinas";
            if (texto.includes("chocolat")) return "chocolates";
            return limpiarId(normalizarTexto(sectorVal || plantaVal));
        }

        function idContenedorTurno(plantaVal, sectorVal, horarioVal) {
            const clave = clavePlantaOSector(plantaVal, sectorVal);
            const turno = limpiarId(normalizarHorario(horarioVal));
            return `cont_${clave}_${turno}`;
        }

        function buscarContenedorConsolidado(horarioVal, plantaVal, sectorVal) {
            const idDirecto = idContenedorTurno(plantaVal, sectorVal, horarioVal);
            const directo = document.getElementById(idDirecto);
            if (directo) return directo;

            const horNorm = normalizarHorario(horarioVal);
            const clave = clavePlantaOSector(plantaVal, sectorVal);
            const bloques = [...document.querySelectorAll('.horario-block')];

            const match = bloques.find(b =>
                normalizarHorario(b.dataset.horario) === horNorm &&
                clavePlantaOSector(b.dataset.planta, b.dataset.sector) === clave
            );
            return match ? match.querySelector('.rows-container') : null;
        }
        function coincidePlantaOSector(destino, plantaSector, nombreSector) {
            const destNorm = normalizarTexto(destino);
            const plaNorm = normalizarTexto(plantaSector);
            const secNorm = normalizarTexto(nombreSector);

            if (destNorm.includes("vacac") || secNorm.includes("vacac")) {
                return destNorm.includes("vacac") && secNorm.includes("vacac");
            }
            if (destNorm.includes("golosin") || secNorm.includes("golosin") || plaNorm.includes("golosin")) {
                return destNorm.includes("golosin") && (secNorm.includes("golosin") || plaNorm.includes("golosin"));
            }
            if (destNorm.includes("chocolat") || secNorm.includes("chocolat") || plaNorm.includes("chocolat")) {
                return destNorm.includes("chocolat") && (secNorm.includes("chocolat") || plaNorm.includes("chocolat"));
            }
            return destNorm === secNorm || destNorm === plaNorm;
        }
        function renderizarUI() {
            const grid = document.getElementById('gridContenedor');
            grid.innerHTML = "";

            const sectores = datosGlobales.sectores || [];
            if (sectores.length === 0) {
                grid.innerHTML = `<p style="padding:20px; color:#555;">No hay sectores configurados en la base de datos para este módulo.</p>`;
                return;
            }

            const asignados = Array.isArray(datosGlobales.asignados) ? [...datosGlobales.asignados] : [];
            asignados.sort((x, y) => {
                const idX = parseInt(x[0], 10);
                const idY = parseInt(y[0], 10);
                if (!Number.isNaN(idX) && !Number.isNaN(idY) && idX !== idY) {
                    return idX - idY;
                }
                return String(x[1] || "").localeCompare(String(y[1] || ""), "es");
            });

            const bloquesCreados = [];

            sectores.forEach(secObj => {
                const nombreSector = String(secObj.sector || "").trim();
                const plantaSector = String(secObj.planta || nombreSector).trim();
                const turnos = Array.isArray(secObj.turnos) ? secObj.turnos : [];

                const card = document.createElement('div');
                card.className = "card-carga sector-card";
                card.innerHTML = `<h3 class="card-titulo">${escaparHtml(nombreSector)}</h3>`;

                turnos.forEach(horario => {
                    const turnoLimpio = String(horario || "").trim();
                    if (!turnoLimpio) return;

                    const idContRows = `container_${limpiarId(nombreSector)}_${limpiarId(turnoLimpio)}`;

                    const blockDiv = document.createElement('div');
                    blockDiv.className = "horario-block turno-box";
                    blockDiv.dataset.horario = turnoLimpio;
                    blockDiv.dataset.planta = plantaSector;
                    blockDiv.dataset.sector = nombreSector;

                    blockDiv.innerHTML = `
                        <div class="horario-header">
                            <strong>Horario: ${escaparHtml(turnoLimpio)}</strong>
                            <button type="button" class="btn-agregar-op" onclick="agregarFilaOperario('${idContRows}')">+ Agregar operario</button>
                        </div>
                        <div class="rows-container filas-container" id="${idContRows}"></div>
                    `;

                    card.appendChild(blockDiv);
                    bloquesCreados.push({
                        idContRows,
                        turnoLimpio,
                        plantaSector,
                        nombreSector
                    });
                });

                grid.appendChild(card);
            });

            bloquesCreados.forEach(bloque => {
                const turnoNorm = normalizarTexto(bloque.turnoLimpio);
                const asignadosEnBloque = asignados.filter(a => {
                    const horAsig = normalizarTexto(a[2]);
                    if (horAsig !== turnoNorm) return false;

                    const planAsig = normalizarTexto(a[3]);
                    const secAsig = normalizarTexto(a[4]);
                    const destino = secAsig || planAsig;

                    if (!destino) return false;
                    return coincidePlantaOSector(destino, bloque.plantaSector, bloque.nombreSector);
                });

                asignadosEnBloque.forEach(a => {
                    agregarFilaOperario(bloque.idContRows, a[0], a[1]);
                });
            });
        }

        function poblarSelectMecanico(selectOp, inputId, idInicial = "", nombreInicial = "") {
            const idActual = String(inputId.value || idInicial || selectOp.getAttribute('data-id-inicial') || "").trim();
            const nombreActual = String(nombreInicial || selectOp.getAttribute('data-operario-inicial') || "").trim();
            const nombreNorm = normalizarTexto(nombreActual);

            selectOp.innerHTML = `<option value="">-- Seleccione Operario --</option>`;

            let encontrado = false;
            let idResuelto = "";

            mecanicosDisponibles.forEach(([id, nombre]) => {
                const nombreLimpio = String(nombre || "").trim();
                if (!nombreLimpio) return;

                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = nombreLimpio;

                const coincideId = idActual !== "" && String(id).trim() === idActual;
                const coincideNombre = nombreNorm !== "" && normalizarTexto(nombreLimpio) === nombreNorm;

                if (coincideId || coincideNombre) {
                    opt.selected = true;
                    encontrado = true;
                    idResuelto = id;
                }
                selectOp.appendChild(opt);
            });

            if (!encontrado && nombreActual) {
                const opt = document.createElement('option');
                opt.value = idActual || nombreActual;
                opt.textContent = nombreActual;
                opt.selected = true;
                selectOp.appendChild(opt);
                idResuelto = idActual || "";
            }

            if (idResuelto !== "") {
                selectOp.value = idResuelto;
                inputId.value = idResuelto;
            } else if (idActual !== "") {
                inputId.value = idActual;
            }
        }

        function actualizarOpcionesSelects() {
            document.querySelectorAll('.fila-operario').forEach(fila => {
                const inputId = fila.querySelector('.input-id-box');
                const selectOp = fila.querySelector('.select-operario-mecanico');
                if (inputId && selectOp) {
                    poblarSelectMecanico(selectOp, inputId);
                }
            });
        }

        function agregarFilaOperario(idContRows, idVal = "", nombreVal = "") {
            const container = document.getElementById(idContRows);
            if (!container) return;

            const filaDiv = document.createElement('div');
            filaDiv.className = "fila-operario";

            const inputId = document.createElement('input');
            inputId.type = "text";
            inputId.className = "input-id-box";
            inputId.value = idVal ?? "";
            inputId.readOnly = true;

            const selectOp = document.createElement('select');
            selectOp.className = "select-operario-mecanico";
            if (idVal !== "" && idVal !== null && idVal !== undefined) {
                selectOp.setAttribute('data-id-inicial', String(idVal).trim());
            }
            if (nombreVal) {
                selectOp.setAttribute('data-operario-inicial', String(nombreVal).trim());
            }

            selectOp.onchange = (e) => {
                const valSel = e.target.value;
                inputId.value = valSel;
                const optSel = selectOp.options[selectOp.selectedIndex];
                if (optSel && optSel.textContent) {
                    selectOp.setAttribute('data-operario-inicial', optSel.textContent.trim());
                }
                selectOp.setAttribute('data-id-inicial', String(valSel || "").trim());
            };

            const btnEliminar = document.createElement('button');
            btnEliminar.type = "button";
            btnEliminar.className = "btn-eliminar-op";
            btnEliminar.textContent = "Eliminar";
            btnEliminar.onclick = () => filaDiv.remove();

            filaDiv.appendChild(inputId);
            filaDiv.appendChild(selectOp);
            filaDiv.appendChild(btnEliminar);

            container.appendChild(filaDiv);
            poblarSelectMecanico(selectOp, inputId, idVal, nombreVal);
        }

        async function guardarMecanicos() {
            const registros = [];

            document.querySelectorAll('.horario-block').forEach(bloque => {
                const horario = bloque.dataset.horario;
                const planta = bloque.dataset.planta;
                const sector = bloque.dataset.sector;

                bloque.querySelectorAll('.fila-operario').forEach(fila => {
                    const idOp = fila.querySelector('.input-id-box').value;
                    if (idOp) {
                        registros.push([parseInt(idOp, 10), horario, planta, sector]);
                    }
                });
            });

            try {
                const res = await fetch('/api/mecanicos/guardar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        semana: semanaActualGlobal,
                        registros: registros
                    })
                });

                const r = await res.json();
                if (r.status === 'ok') {
                    alert("Horarios de mecánicos guardados correctamente.");
                    await cargarDatos();
                } else {
                    alert("Error al guardar: " + (r.message || r.mensaje || ""));
                }
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Ocurrió un error al intentar guardar.");
            }
        }

        window.onload = init;
</script>
</body>
</html>
