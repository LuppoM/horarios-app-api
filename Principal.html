<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMADO DE HORARIOS</title>

    <!-- Ícono ubicado en la carpeta static -->
    <link rel="icon" type="image/x-icon" href="/static/icono.ico">

    <!-- CSS ubicado en la misma carpeta raíz -->
    <link rel="stylesheet" href="/archivos/principalvista.css">

    <style>
        /* Estilos para el badge de estado en los botones */
        .badge-estado {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: bold;
            display: inline-block;
            vertical-align: middle;
        }
        .badge-ok {
            background-color: #28a745;
            color: #ffffff;
        }
        .badge-pendiente {
            background-color: #ffc107;
            color: #212529;
        }
    </style>
</head>
<body>

    <div class="fondo-frame">
        <div class="button-frame">

            <!-- 1. MENÚ DESPLEGABLE: HORARIOS -->
            <div class="dropdown">
                <button class="dropdown-btn" onclick="toggleDropdown(event, 'menuHorarios')">HORARIOS ▼</button>
                <div id="menuHorarios" class="dropdown-menu">
                    <a href="/hchoco">Chocolates</a>
                    <a href="/hgolo">Golosinas</a>
                    <a href="/mecanicos">Mecanicos</a>
                </div>
            </div>

            <!-- 2. BOTÓN FIJO -->
            <a href="/modmoi" class="custom-button">CONSOLIDADO AMBAS PLANTAS</a>

            <!-- 3. MENÚ DESPLEGABLE: DOTACIÓN PROGRAMADA CON NOTIFICACIÓN DE ESTADO -->
            <!-- MENÚ DESPLEGABLE: DOTACIÓN PROGRAMADA -->
        <div class="dropdown">
            <button class="dropdown-btn" onclick="toggleDropdown(event, 'menuDtProgramada')">
                DOTACION PROGRAMADA <span id="badgeEstadoDt" class="badge-estado badge-pendiente">...</span> ▼
            </button>
            <div id="menuDtProgramada" class="dropdown-menu">
                <!-- Pasamos el parámetro ?semana={{ semana_actual }} -->
                <a href="/dtprogramada?semana={{ semana_actual }}">Cargar Dotación Programada</a>
                <hr style="margin: 4px 0; border: 0; border-top: 1px solid #ccc;">
                <a href="/generar_dt_pdf?planta=chocolates&semana={{ semana_actual }}">Generar PDF - Chocolates</a>
                <a href="/generar_dt_pdf?planta=golosinas&semana={{ semana_actual }}">Generar PDF - Golosinas</a>
                <a href="/generar_dt_pdf?planta=ambas&semana={{ semana_actual }}">Generar PDF - Ambas Plantas</a>
            </div>
        </div>

            <!-- 4. MENÚ DESPLEGABLE: PARÁMETROS -->
            <div class="dropdown">
                <button class="dropdown-btn" onclick="toggleDropdown(event, 'menuParametros')">PARÁMETROS ▼</button>
                <div id="menuParametros" class="dropdown-menu">
                    <a href="/sectores">Sectores</a>
                    <a href="/tipohorarios">Tipos de Horario</a>
                </div>
            </div>

            <!-- 5. BOTÓN SALIR -->
            <a href="/" class="custom-button">SALIR</a>

        </div>
    </div>

    <script>
        // Función para abrir / cerrar desplegables
        function toggleDropdown(event, menuId) {
            event.stopPropagation();
            
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                if (menu.id !== menuId) {
                    menu.classList.remove('show');
                }
            });

            const menu = document.getElementById(menuId);
            if (menu) {
                menu.classList.toggle('show');
            }
        }

        // Cerrar menú al hacer click fuera
        window.addEventListener('click', function() {
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                menu.classList.remove('show');
            });
        });

        // Consultar estado de Dotación Programada al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/dtprogramada/datos')
                .then(res => res.json())
                .then(data => {
                    const badge = document.getElementById('badgeEstadoDt');
                    if (!badge) return;

                    if (data.finalizado || data.estado === "FINALIZADO") {
                        badge.className = 'badge-estado badge-ok';
                        badge.innerText = '✅ LISTO';
                        badge.title = `Semana ${data.semana} finalizada por ${data.modificado_por || 'Programación'}`;
                    } else {
                        badge.className = 'badge-estado badge-pendiente';
                        badge.innerText = '⚠️ PENDIENTE';
                        badge.title = `Semana ${data.semana} pendiente de carga`;
                    }
                })
                .catch(err => {
                    console.error('Error al obtener estado de dotación:', err);
                    const badge = document.getElementById('badgeEstadoDt');
                    if (badge) badge.style.display = 'none';
                });
        });
    </script>
</body>
</html>
