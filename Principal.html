<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARMADO DE HORARIOS</title>

    <link rel="icon" type="image/x-icon" href="/static/icono.ico">
    <link rel="stylesheet" href="/archivos/principalvista.css">

    <style>
        /* Oculta la barra hasta aplicar permisos para evitar parpadeo */
        .button-frame {
            visibility: hidden;
        }
        .button-frame.listo {
            visibility: visible;
        }

        .badge-estado {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            margin-left: 6px;
            font-weight: bold;
            display: inline-block;
            vertical-align: middle;
        }
        .badge-ok {
            background-color: #28a745;
            color: #ffffff;
        }
        .badge-pendiente {
            background-color: #ffc107;
            color: #212529;
        }
    </style>
</head>
<body>

    <div class="fondo-frame">
        <div id="barraBotones" class="button-frame">

            <!-- 1. MENÚ DESPLEGABLE: HORARIOS -->
            <div id="btnModuloHorarios" class="dropdown">
                <button class="dropdown-btn" onclick="toggleDropdown(event, 'menuHorarios')">HORARIOS ▼</button>
                <div id="menuHorarios" class="dropdown-menu">
                    <a href="/hchoco">Chocolates</a>
                    <a href="/hgolo">Golosinas</a>
                    <a href="/mecanicos">Mecanicos</a>
                    <a href="/analistascalidad">Calidad</a>
                    <a href="/depositomp">Depósito Materia Prima</a>
                    <a href="/depositopt">Depósito Producto Terminado</a>
                </div>
            </div>

            <!-- 2. BOTÓN FIJO -->
            <a id="btnModuloConsolidado" href="/modmoi" class="custom-button">CONSOLIDADO</a>

            <!-- 3. MENÚ DESPLEGABLE: DOTACIÓN PROGRAMADA -->
            <div id="btnModuloDotacion" class="dropdown">
                <button class="dropdown-btn" onclick="toggleDropdown(event, 'menuDtProgramada')">
                    DOTACION PROGRAMADA <span id="badgeEstadoDt" class="badge-estado badge-pendiente">...</span> ▼
                </button>
                <div id="menuDtProgramada" class="dropdown-menu">
                    <a href="/dtprogramada?semana={{ semana_actual }}">Cargar Dotación Programada</a>
                    <hr style="margin: 4px 0; border: 0; border-top: 1px solid #ccc;">
                    <a href="/generar_dt_pdf?planta=chocolates&semana={{ semana_actual }}">Generar PDF - Chocolates</a>
                    <a href="/generar_dt_pdf?planta=golosinas&semana={{ semana_actual }}">Generar PDF - Golosinas</a>
                    <a href="/generar_dt_pdf?planta=ambas&semana={{ semana_actual }}">Generar PDF - Ambas Plantas</a>
                </div>
            </div>

            <!-- 4. MENÚ DESPLEGABLE: PARÁMETROS -->
            <div id="btnModuloParametros" class="dropdown">
                <button class="dropdown-btn" onclick="toggleDropdown(event, 'menuParametros')">PARÁMETROS ▼</button>
                <div id="menuParametros" class="dropdown-menu">
                    <a href="/sectores">Sectores</a>
                    <a href="/tipohorarios">Tipos de horario</a>
                    <a href="/abmusuarios">Usuarios y permisos</a>
                </div>
            </div>

            <button type="button" class="custom-button" onclick="cerrarSesion()">SALIR</button>

        </div>
    </div>

    <script>
        const sesionRaw = sessionStorage.getItem('usuario_sesion');
        if (!sesionRaw) {
            window.location.replace('/login');
        }

        const RUTAS_HORARIOS_POR_AREA = {
            'ADMIN': ['/hchoco', '/hgolo', '/mecanicos', '/analistascalidad', '/depositomp', '/depositopt'],
            'ADMINISTRADOR': ['/hchoco', '/hgolo', '/mecanicos', '/analistascalidad', '/depositomp', '/depositopt'],
            'PRODUCCION': ['/hchoco', '/hgolo'],
            'PRODUCCIÓN': ['/hchoco', '/hgolo'],
            'MANTENIMIENTO': ['/mecanicos'],
            'CALIDAD': ['/analistascalidad'],
            'DEPOSITO MATERIA PRIMA': ['/depositomp'],
            'DEPÓSITO MATERIA PRIMA': ['/depositomp'],
            'DEPOSITOMP': ['/depositomp'],
            'DEPOSITO MP': ['/depositomp'],
            'DEPOSITO PRODUCTO TERMINADO': ['/depositopt'],
            'DEPÓSITO PRODUCTO TERMINADO': ['/depositopt'],
            'DEPOSITOPT': ['/depositopt'],
            'DEPOSITO PT': ['/depositopt']
        };

        function renderizarPermisosEnDOM(sesion) {
            const areaActual = String(sesion.area || '').trim().toUpperCase();
            const usuarioActual = String(sesion.usuario || '').trim().toUpperCase();
            const esAdmin = areaActual === 'ADMIN' || usuarioActual === 'ADMIN';

            let permisos = Array.isArray(sesion.permisos)
                ? sesion.permisos.map(p => String(p).toUpperCase())
                : (esAdmin ? ['HORARIOS', 'CONSOLIDADO', 'DOTACION_PROGRAMADA', 'PARAMETROS'] : ['HORARIOS', 'CONSOLIDADO']);

            const mapaBotones = {
                'HORARIOS': 'btnModuloHorarios',
                'CONSOLIDADO': 'btnModuloConsolidado',
                'DOTACION_PROGRAMADA': 'btnModuloDotacion',
                'PARAMETROS': 'btnModuloParametros'
            };

            Object.entries(mapaBotones).forEach(([clavePermiso, idElemento]) => {
                const el = document.getElementById(idElemento);
                if (el && !permisos.includes(clavePermiso)) {
                    el.remove();
                }
            });

            const rutasPermitidas = RUTAS_HORARIOS_POR_AREA[areaActual]
                                 || RUTAS_HORARIOS_POR_AREA[usuarioActual]
                                 || [];

            const menuHorarios = document.getElementById('menuHorarios');
            if (menuHorarios) {
                Array.from(menuHorarios.querySelectorAll('a')).forEach(enlace => {
                    const href = enlace.getAttribute('href');
                    if (!rutasPermitidas.includes(href)) {
                        enlace.remove();
                    }
                });
            }

            const barra = document.getElementById('barraBotones');
            if (barra) barra.classList.add('listo');
        }

        async function iniciarPermisosMenuPrincipal() {
            if (!sesionRaw) return;

            let sesion = {};
            try {
                sesion = JSON.parse(sesionRaw);
            } catch (e) {
                window.location.replace('/login');
                return;
            }

            // 1. Aplica al instante lo guardado en sessionStorage y muestra la barra sin parpadeo
            renderizarPermisosEnDOM(sesion);

            // 2. Sincroniza en segundo plano con el servidor por si cambiaron permisos en BD
            try {
                const usuarioActual = String(sesion.usuario || '').trim().toUpperCase();
                const resp = await fetch('/api/usuarios', {
                    headers: { 'X-Usuario': sesion.usuario || '' }
                });
                if (resp.ok) {
                    const data = await resp.json();
                    const lista = Array.isArray(data) ? data : (data.datos || []);
                    const encontrado = lista.find(
                        u => String(u.usuario || '').trim().toUpperCase() === usuarioActual
                    );
                    if (encontrado && Array.isArray(encontrado.permisos)) {
                        const anteriores = JSON.stringify(sesion.permisos || []);
                        const nuevos = JSON.stringify(encontrado.permisos);
                        if (anteriores !== nuevos) {
                            sesion.permisos = encontrado.permisos;
                            sessionStorage.setItem('usuario_sesion', JSON.stringify(sesion));
                            window.location.reload();
                        }
                    }
                }
            } catch (e) {
                console.warn('No se pudieron refrescar permisos desde API.');
            }
        }

        // Ejecuta apenas se parsea el DOM, sin esperar imágenes ni scripts externos
        iniciarPermisosMenuPrincipal();

        function toggleDropdown(event, menuId) {
            event.stopPropagation();

            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                if (menu.id !== menuId) {
                    menu.classList.remove('show');
                }
            });

            const menu = document.getElementById(menuId);
            if (menu) {
                menu.classList.toggle('show');
            }
        }

        window.addEventListener('click', function() {
            document.querySelectorAll('.dropdown-menu').forEach(menu => {
                menu.classList.remove('show');
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            const badge = document.getElementById('badgeEstadoDt');
            if (badge) {
                fetch('/api/dtprogramada/datos?semana={{ semana_actual }}')
                    .then(res => res.json())
                    .then(data => {
                        if (data.finalizado || data.estado === "FINALIZADO") {
                            badge.className = 'badge-estado badge-ok';
                            badge.innerText = '✅ LISTO';
                            badge.title = `Semana ${data.semana} finalizada por ${data.modificado_por || 'Programación'}`;
                        } else {
                            badge.className = 'badge-estado badge-pendiente';
                            badge.innerText = '⚠️ PENDIENTE';
                            badge.title = `Semana ${data.semana} pendiente de carga`;
                        }
                    })
                    .catch(err => {
                        console.error('Error al obtener estado de dotación:', err);
                        badge.style.display = 'none';
                    });
            }
        });

        function cerrarSesion(e) {
            if (e) e.preventDefault();
            sessionStorage.removeItem('usuario_sesion');
            window.location.replace('/login');
        }
    </script>
</body>
</html>
